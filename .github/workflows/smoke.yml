name: Smoke Test

on:
  push:
    branches:
      - "feature/**"
  workflow_dispatch:
    inputs:
      topic:
        description: "Topic for smoke test documentary"
        type: string
        default: "Singapore"
        required: false
      seconds:
        description: "Target duration in seconds"
        type: string
        default: "60"
        required: false

permissions:
  contents: read

jobs:
  smoke:
    name: Full Pipeline Smoke Test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng fonts-dejavu-core
      
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Run smoke test
        id: smoke
        run: |
          cd /root/geofactory-ai-documentary
          TOPIC="${{ github.event.inputs.topic || 'Singapore' }}"
          SECONDS="${{ github.event.inputs.seconds || '60' }}"
          python -m geofactory smoke --topic "$TOPIC" --seconds "$SECONDS" --out output/smoke 2>&1 | tee smoke.log
          echo "exit_code=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT
        continue-on-error: true
      
      - name: Upload smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-artifacts
          path: |
            output/smoke/
            smoke.log
          retention-days: 7
      
      - name: Check smoke result
        if: always()
        run: |
          if [ "${{ steps.smoke.outputs.exit_code }}" != "0" ]; then
            echo "::error::Smoke test failed with exit code ${{ steps.smoke.outputs.exit_code }}"
            exit 1
          fi

  smoke-remotion:
    name: Remotion Render (Smoke Plan)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: smoke
    continue-on-error: true
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      
      - name: Install system dependencies for Remotion (Chromium + Linux deps)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libnss3 libdbus-1-3 libatk1.0-0 libasound2t64 libxrandr2 \
            libxkbcommon-x11-0 libxfixes3 libxcomposite1 libxdamage1 \
            libgbm-dev libcups2 libatk-bridge2.0-0 libpango-1.0-0 libcairo2
      
      - name: Install Remotion dependencies
        working-directory: ./studio/remotion
        run: |
          npm ci
          npx remotion browser ensure
      
      - name: Run Remotion render using smoke plan
        run: |
          cd /root/geofactory-ai-documentary
          # Find the smoke job output directory
          SMOKE_DIR=$(ls -dt output/smoke-* 2>/dev/null | head -1 || echo "output/smoke")
          if [ -f "$SMOKE_DIR/scene_manifest.json" ]; then
            python -m geofactory remotion-render "smoke-test" --output remotion_smoke.mp4 --composition DynamicDocumentary 2>&1 | tee remotion.log
          else
            echo "No scene_manifest.json found in $SMOKE_DIR, skipping Remotion render"
          fi
      
      - name: Upload Remotion artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: remotion-artifacts
          path: |
            output/smoke/remotion_smoke.mp4
            remotion.log
          retention-days: 7
