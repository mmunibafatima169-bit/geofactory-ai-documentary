name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

jobs:
  test:
    name: Python Tests (3.12)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    
    env:
      GEOFACTORY_REQUIRE_DEPS: "1"
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      
      - name: Install system dependencies
        timeout-minutes: 8
        run: |
          sudo apt-get update -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30
          sudo apt-get install -y --no-install-recommends ffmpeg espeak-ng fonts-dejavu-core -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30
      
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Verify dependencies
        run: |
          python -c "import PIL; print(f'PIL version: {PIL.__version__}')"
          ffmpeg -version | head -1
          espeak-ng --version | head -1
      
      - name: Run unit tests
        shell: bash
        run: |
          set -o pipefail
          python -m unittest discover -v 2>&1 | tee test_output.log
      
      - name: Summarize test results
        if: always()
        shell: bash
        run: |
          if [ -f test_output.log ]; then
            echo "### Test Results" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            grep -E "^(FAIL|ERROR):" test_output.log | head -20 >> $GITHUB_STEP_SUMMARY || echo "No failures/errors found" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            tail -5 test_output.log >> $GITHUB_STEP_SUMMARY
          fi
      
      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: test_output.log
          retention-days: 7

  lint:
    name: Syntax Check
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      
      - name: Verify Python syntax
        run: |
          python -m py_compile $(find . -name "*.py" -not -path "./studio/remotion/*" -not -path "./.git/*")
      
      - name: Run pyflakes
        run: |
          pip install pyflakes
          python -m pyflakes geofactory > pyflakes.txt || true
          cat pyflakes.txt
          if grep -n "undefined name" pyflakes.txt; then echo "undefined names found"; exit 1; fi
